# Headless CMS stack:
#   db      -> Postgres 16 with the pgvector extension (guideline embeddings)
#   backend -> FastAPI (management + delivery/preview APIs, AI, webhooks, WebSockets)
#   editor  -> Next.js visual editor (spaces/environments, content model, entries,
#              media library, settings, AI sidebar, live preview)
#   preview -> Next.js preview/delivery site (draft mode + inline-editing bridge)
#   marketing -> Next.js public marketing/brand site for Ondros CMS (:3002)
#   superadmin -> Next.js platform-operator dashboard (:3003, spec 013)
#
# Copy .env.example to .env (set an AI provider if you want AI features), then:
#   docker compose up -d
#   docker compose exec backend python -m app.seed
#
# The seed prints dev API tokens; the defaults below match them, so the preview
# app works out of the box. Rotate everything before exposing publicly.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://cms:cms@db:5432/cms
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3003
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # --- Social OAuth (specs 002 + 012) ------------------------------------
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      # --- AI provider (see .env.example; groq/gemini/ollama are free) ------
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      # --- Azure OpenAI (only when AI_PROVIDER=azure_openai) ----------------
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-06-01}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-4o}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
      # --- Dev API tokens created by the seed script ------------------------
      SEED_DELIVERY_TOKEN: ${SEED_DELIVERY_TOKEN:-cms_del_dev-delivery-token-0000}
      SEED_PREVIEW_TOKEN: ${SEED_PREVIEW_TOKEN:-cms_pre_dev-preview-token-0000}
    ports:
      - "8000:8000"
    volumes:
      # Live-reload for development; remove for production images.
      - ./backend:/app
      - backend_media:/app/media

  editor:
    build: ./editor
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_PREVIEW_URL: http://localhost:3001
      # Dev-only: the editor embeds the preview URL with this preview API key.
      # In production, mint short-lived preview keys on the backend instead.
      NEXT_PUBLIC_PREVIEW_TOKEN: ${SEED_PREVIEW_TOKEN:-cms_pre_dev-preview-token-0000}
    ports:
      - "3000:3000"
    volumes:
      - ./editor:/app
      - editor_node_modules:/app/node_modules

  preview:
    build: ./preview
    depends_on:
      - backend
    environment:
      # Server-side fetches go over the Docker network; browser-side (WS + media) uses localhost.
      CMS_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      CMS_PREVIEW_TOKEN: ${SEED_PREVIEW_TOKEN:-cms_pre_dev-preview-token-0000}
      CMS_DELIVERY_TOKEN: ${SEED_DELIVERY_TOKEN:-cms_del_dev-delivery-token-0000}
    ports:
      - "3001:3001"
    volumes:
      - ./preview:/app
      - preview_node_modules:/app/node_modules

  marketing:
    build: ./marketing
    environment:
      # Where the marketing site's Login / Get Started CTAs send visitors
      # (the authenticated editor app) — configurable per environment.
      NEXT_PUBLIC_APP_LOGIN_URL: ${APP_LOGIN_URL:-http://localhost:3000/login}
      NEXT_PUBLIC_APP_SIGNUP_URL: ${APP_SIGNUP_URL:-http://localhost:3000/signup}
    ports:
      - "3002:3002"
    volumes:
      - ./marketing:/app
      - marketing_node_modules:/app/node_modules

  superadmin:
    build: ./superadmin
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Impersonation sessions open the editor app here (spec 013).
      NEXT_PUBLIC_EDITOR_URL: http://localhost:3000
    ports:
      - "3003:3003"
    volumes:
      - ./superadmin:/app
      - superadmin_node_modules:/app/node_modules

volumes:
  pgdata:
  backend_media:
  editor_node_modules:
  preview_node_modules:
  marketing_node_modules:
  superadmin_node_modules:
