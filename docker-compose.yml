# Headless CMS stack:
#   db      -> Postgres 16 with the pgvector extension (guideline embeddings)
#   backend -> FastAPI (management + delivery/preview APIs, AI, webhooks, WebSockets)
#   editor  -> Next.js visual editor (spaces/environments, content model, entries,
#              media library, settings, AI sidebar, live preview)
#   preview -> Next.js preview/delivery site (draft mode + inline-editing bridge)
#   superadmin -> Next.js platform-operator dashboard (:3003, spec 013)
#
# The marketing/brand site now lives in its own repo (ondros-cms-site),
# deployed separately on Vercel. Its Login / Get Started CTAs point at
# this app's editor via NEXT_PUBLIC_APP_LOGIN_URL / NEXT_PUBLIC_APP_SIGNUP_URL,
# set in that repo's own environment config — nothing to wire up here.
#
# Copy .env.example to .env (set an AI provider if you want AI features), then:
#   docker compose up -d
#   docker compose exec backend python -m app.seed
#
# The seed prints dev API tokens; the defaults below match them, so the preview
# app works out of the box. Rotate everything before exposing publicly.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Dev-only hot reload (Dockerfile's default CMD omits --reload for prod).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://cms:cms@db:5432/cms
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3003
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # --- Accounts & email (spec 001) ---------------------------------------
      # AUTH_DEV_MODE=true returns verification/reset tokens in API responses
      # and logs emails instead of sending — never enable outside local dev.
      AUTH_DEV_MODE: ${AUTH_DEV_MODE:-true}
      # Transport: resend | brevo | smtp | log. Empty = auto-detect in that order.
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: "${MAIL_FROM:-}"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-Ondros CMS <prot.das15@gmail.com>}"
      # --- Billing (spec 005) -------------------------------------------------
      BILLING_DEV_MODE: ${BILLING_DEV_MODE:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # --- Social OAuth (specs 002 + 012) ------------------------------------
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      # --- Ondros Code Sync (spec 020): GitHub App that connects a space to
      # the repo rendering its site. Unset = the editor explains it isn't set
      # up yet. See docs/20-code-sync.md.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-ondros-code-sync}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # --- AI provider (see .env.example; groq/gemini/ollama are free) ------
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      # --- Azure OpenAI (only when AI_PROVIDER=azure_openai) ----------------
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-06-01}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-4o}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
      # --- Dev API tokens created by the seed script ------------------------
      SEED_DELIVERY_TOKEN: ${SEED_DELIVERY_TOKEN:-cms_del_dev-delivery-token-0000}
      SEED_PREVIEW_TOKEN: ${SEED_PREVIEW_TOKEN:-cms_pre_dev-preview-token-0000}
    ports:
      - "8000:8000"
    volumes:
      # Live-reload for development; remove for production images.
      - ./backend:/app
      - backend_media:/app/media

  editor:
    build: ./editor
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_PREVIEW_URL: http://localhost:3001
      # Dev-only: the editor embeds the preview URL with this preview API key.
      # In production, mint short-lived preview keys on the backend instead.
      NEXT_PUBLIC_PREVIEW_TOKEN: ${SEED_PREVIEW_TOKEN:-cms_pre_dev-preview-token-0000}
      # --- Contact details shown on the legal/support pages -----------------
      # Inlined at BUILD time: change these and rebuild the editor image.
      NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-prot.das15@gmail.com}
      NEXT_PUBLIC_PRIVACY_EMAIL: ${PRIVACY_EMAIL:-prot.das15@gmail.com}
      NEXT_PUBLIC_SECURITY_EMAIL: ${SECURITY_EMAIL:-prot.das15@gmail.com}
      NEXT_PUBLIC_LEGAL_COMPANY: ${LEGAL_COMPANY:-}
      NEXT_PUBLIC_LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      NEXT_PUBLIC_LEGAL_JURISDICTION: ${LEGAL_JURISDICTION:-}
    ports:
      - "3000:3000"
    volumes:
      - ./editor:/app
      - editor_node_modules:/app/node_modules

  preview:
    build: ./preview
    depends_on:
      - backend
    environment:
      # Server-side fetches go over the Docker network; browser-side (WS + media) uses localhost.
      CMS_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      CMS_PREVIEW_TOKEN: ${SEED_PREVIEW_TOKEN:-cms_pre_dev-preview-token-0000}
      CMS_DELIVERY_TOKEN: ${SEED_DELIVERY_TOKEN:-cms_del_dev-delivery-token-0000}
    ports:
      - "3001:3001"
    volumes:
      - ./preview:/app
      - preview_node_modules:/app/node_modules

  superadmin:
    build: ./superadmin
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Impersonation sessions open the editor app here (spec 013).
      NEXT_PUBLIC_EDITOR_URL: http://localhost:3000
    ports:
      - "3003:3003"
    volumes:
      - ./superadmin:/app
      - superadmin_node_modules:/app/node_modules

volumes:
  pgdata:
  backend_media:
  editor_node_modules:
  preview_node_modules:
  superadmin_node_modules:
